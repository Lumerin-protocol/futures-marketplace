# Use subgraph.template.yaml to add changes to the subgraph.yaml file
# Variables are substituted via envsubst from environment variables
specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: HashPowerFutures
    network: "${NETWORK}"
    source:
      address: "${FUTURES_ADDRESS}"
      startBlock: ${START_BLOCK_FUTURES}
      abi: HashPowerFutures
    context:
      startBlock:
        type: BigInt
        data: "${START_BLOCK_FUTURES}"
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Futures
        - User
        - Order
        - Trade
        - Fill
        - PositionSession
        - PriceLevel
        - FuturesExpiration
        - LiquidationTx
        - BadDebtEvent
        - UserDeliverySessionPointer
      abis:
        - name: HashPowerFutures
          file: ../contracts/abi/HashPowerFutures.json
      eventHandlers:
        - event: Initialized(uint64)
          handler: handleInitialized
        - event: Upgraded(indexed address)
          handler: handleUpgraded
        - event: OrderCreated(indexed bytes32,indexed address,uint256,int256,uint256)
          handler: handleOrderCreated
        - event: OrderUpdated(indexed bytes32,indexed address,int256)
          handler: handleOrderUpdated
        - event: OrderCancelled(indexed bytes32,indexed address)
          handler: handleOrderCancelled
        - event: OrderMatched(indexed bytes32,indexed address,indexed address,uint256,uint256,int256,int256,int256,int256,int256,uint256,uint256)
          handler: handleOrderMatched
        - event: OrderLiquidated(indexed bytes32,indexed address,indexed address,uint256)
          handler: handleOrderLiquidated
        - event: PositionLiquidated(indexed address,indexed address,uint256,int256,int256,uint256)
          handler: handlePositionLiquidated
        - event: PositionSettled(indexed address,indexed uint256,int256,int256,uint256,address)
          handler: handlePositionSettled
        - event: FutureExpirationDatesCountUpdated(uint8)
          handler: handleFutureExpirationDatesCountUpdated
        - event: MakerFeeBpsUpdated(int16)
          handler: handleMakerFeeBpsUpdated
        - event: TakerFeeBpsUpdated(int16)
          handler: handleTakerFeeBpsUpdated
        - event: LiquidationFeeBpsUpdated(uint16)
          handler: handleLiquidationFeeBpsUpdated
        - event: LiquidatorShareBpsUpdated(uint16)
          handler: handleLiquidatorShareBpsUpdated
        - event: OracleUpdated(address)
          handler: handleOracleUpdated
        - event: PortfolioMarginUpdated(address)
          handler: handlePortfolioMarginUpdated
        - event: BadDebt(indexed address,uint256)
          handler: handleBadDebt
        - event: SettlementPriceRecorded(indexed uint256,uint256,address)
          handler: handleSettlementPriceRecorded
      file: ./src/futures.ts
features:
  - grafting
