# Root entity for contract-wide state and stats
type Futures @entity(immutable: false) {
  "Singleton entity, use id=0"
  id: Int8!

  # Contract addresses
  contractAddress: Bytes!
  hashrateOracleAddress: Bytes!
  portfolioMarginAddress: Bytes!

  "Block number the indexer was configured to start from (sourced from the data source context, set via START_BLOCK_FUTURES)."
  startBlock: BigInt!

  # Configuration
  minimumPriceIncrement: BigInt!
  "Maker fee in basis points of notional; negative means a rebate."
  makerFeeBps: Int!
  "Taker fee in basis points of notional."
  takerFeeBps: Int!
  liquidationFeeBps: Int!
  liquidatorShareBps: Int!
  "Contract size in hashes/s\u00b7day (hashrate sustained over one day), read from the on-chain constant CONTRACT_SIZE_HPS_DAY. Oracle answers are rebased by CONTRACT_SIZE_HPS_DAY / (100 TH/s\u00b7day). Fixed at 1e15 (1 PH/s over a day), so one unit = 1 PH/s/day."
  contractSizeHpsDay: BigInt!
  expirationIntervalDays: Int!
  futureExpirationDatesCount: Int!
  firstFutureExpirationDate: BigInt!

  # Pool balances
  collectedFeesBalance: BigInt!

  # Stats
  totalUsers: Int!
  totalOrders: Int! # aggregate Order entities created
  activeOrders: Int! # count of currently-ACTIVE OrderEntry units (per on-chain orderId), NOT Order aggregates
  totalTrades: Int!
  totalFills: Int!
  totalVolume: BigInt!
  totalLiquidations: Int!
  totalBadDebt: BigInt!

  # Timestamps
  initializedAt: BigInt!
  lastUpdatedAt: BigInt!
}

# First-class expiration entity holding cash-settlement metadata for one expiration date.
# Created lazily the first time any entity at that `expirationAt` is indexed; the settlement
# fields stay null until a `SettlementPriceRecorded` event pins the price.
type FuturesExpiration @entity(immutable: false) {
  "32-byte big-endian encoding of the expiration timestamp (expirationAt)."
  id: Bytes!
  "The expiration timestamp this entity represents."
  expirationAt: BigInt!

  "Pinned cash-settlement price (token decimals). Null until SettlementPriceRecorded fires; its presence is the 'settled' signal (no separate boolean)."
  settlementPrice: BigInt
  "Block timestamp at which the settlement price was pinned."
  settledAt: BigInt
  "Address that pinned the price (an explicit recordSettlementPrice caller or the first settlePosition for this expiry)."
  recordedBy: Bytes
  recordTransactionHash: Bytes
  recordBlockNumber: BigInt

  # Back-links (backward-compatible: existing entities keep their `expirationAt` scalar)
  orders: [Order!]! @derivedFrom(field: "expiration")
  positionSessions: [PositionSession!]! @derivedFrom(field: "expiration")
  trades: [Trade!]! @derivedFrom(field: "expiration")
  priceLevels: [PriceLevel!]! @derivedFrom(field: "expiration")
}

# User entity (replaces former Participant)
type User @entity(immutable: false) {
  id: Bytes! # user address
  address: Bytes!

  # Stats
  orderCount: Int! # aggregate Orders ever created
  activeOrderCount: Int! # count of currently-ACTIVE OrderEntry units (per on-chain orderId), NOT Order aggregates
  tradeCount: Int!
  fillCount: Int!
  realizedPnl: BigInt!

  "Transient: orderId of the user's most recent OrderCreated. Used to attribute taker fills on OrderMatched."
  lastCreatedOrderId: Bytes!

  # Relations
  orders: [Order!]! @derivedFrom(field: "user")
  trades: [Trade!]! @derivedFrom(field: "user")
  fills: [Fill!]! @derivedFrom(field: "user")
  positionSessions: [PositionSession!]! @derivedFrom(field: "user")
  "Per-(user, expirationAt) running net qty + open-session pointers, one entry per expiration date the user has touched."
  deliveryPointers: [UserDeliverySessionPointer!]! @derivedFrom(field: "user")
  badDebts: [BadDebtEvent!]! @derivedFrom(field: "user")

  # Timestamps
  createdAt: BigInt!
  lastActivityAt: BigInt!
}

# Aggregate of OrderCreated events for one (user, price, expirationAt, side) within a single tx.
# In 3.0 one createOrder emits one OrderCreated with abs qty; same-price placements in one tx
# still collapse into a single Order aggregate when they share the aggregate key.
type Order @entity(immutable: false) {
  id: Bytes! # tx hash + user + price + expirationAt + side
  user: User!
  price: BigInt!
  expirationAt: BigInt!
  "Expiration metadata for `expirationAt` (settlement price, etc.). Nullable, backward-compatible add-on."
  expiration: FuturesExpiration
  isBuy: Boolean!

  # Counts (contracts)
  quantity: Int! # ACTIVE remaining contracts
  originalQuantity: Int! # initial qty across all entries
  filledQuantity: Int! # contracts that became fills
  cancelledQuantity: Int! # contracts closed without matching
  status: OrderStatus!
  entries: [OrderEntry!]! @derivedFrom(field: "order")

  # Metadata
  createdAt: BigInt!
  updatedAt: BigInt!
  closedAt: BigInt
  blockNumber: BigInt!
  transactionHash: Bytes!
}

enum OrderStatus {
  "Still ACTIVE entries left; no terminal events yet."
  ACTIVE
  "Non-terminal: still has ACTIVE entries plus at least one filled or cancelled."
  PARTIAL
  "Terminal: every entry matched."
  FILLED
  "Terminal: at least one entry matched AND at least one was cancelled."
  PARTIALLY_FILLED
  "Terminal: every entry cancelled (no fills)."
  CANCELLED
}

# One per on-chain orderId (qty-bearing resting placement).
type OrderEntry @entity(immutable: false) {
  id: Bytes! # on-chain orderId
  order: Order!
  "Remaining open contracts on this resting order."
  remainingQuantity: Int!
  status: OrderEntryStatus!
  closedAt: BigInt
  "EOA that sent the tx where this entry closed (tx.from). NOT necessarily the participant — for liquidations it's the keeper, for expiry it's whoever called removeOutdatedOrder. Use `liquidator` for semantic close attribution."
  closedByTx: Bytes
  "Keeper that triggered the close, populated only when status = LIQUIDATED (from the paired OrderLiquidated event)."
  liquidator: Bytes
  "Fee paid by the order's participant to `liquidator`; populated only when status = LIQUIDATED."
  liquidationFee: BigInt
}

enum OrderEntryStatus {
  ACTIVE
  MATCHED
  CANCELLED
  EXPIRED
  LIQUIDATED
  RESET
}

# Aggregate of all fills (across counterparties) in a single tx for one user.
# Mirrors perps' Trade entity.
type Trade @entity(immutable: false) {
  id: Bytes! # tx hash + user address
  user: User!
  positionSession: PositionSession!
  expirationAt: BigInt!
  "Expiration metadata for `expirationAt` (settlement price, etc.). Nullable, backward-compatible add-on."
  expiration: FuturesExpiration

  tradePrice: BigInt! # qty-weighted average fill price
  tradeQuantity: Int! # signed sum of fill quantities
  tradingFee: BigInt!
  realizedPnl: BigInt!
  netQuantityAfter: Int!
  fillCount: Int!

  "True when this Trade was a forced liquidation against the market."
  isLiquidation: Boolean! # default false
  "Keeper that triggered the liquidation; set only when isLiquidation."
  liquidator: Bytes # nullable
  "Fee paid to the liquidator; set only when isLiquidation."
  liquidationFee: BigInt # nullable

  fills: [Fill!]! @derivedFrom(field: "trade")

  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Aggregate of OrderMatched (or exit) legs with the same (tx, user, counterparty, session).
type Fill @entity(immutable: false) {
  id: Bytes! # tx hash + user + counterparty + sessionId
  trade: Trade!
  user: User!
  counterparty: User!
  positionSession: PositionSession!
  expirationAt: BigInt!

  fillPrice: BigInt! # qty-weighted average fill price
  fillQuantity: Int! # signed sum for this user (+buy / -sell)
  netQuantityAfter: Int! # user's (expirationAt) net qty after this fill
  realizedPnl: BigInt! # accumulated pnl on this fill aggregation
  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Open→close cycle for a (user, expirationAt) pair.
# A user can have multiple sessions concurrently — one per expiration date.
type PositionSession @entity(immutable: false) {
  id: String! # blockNumber (12 digits) + logIndex (6 digits) + side; deterministic
  status: PositionSessionStatus!
  user: User!
  expirationAt: BigInt!
  "Expiration metadata for `expirationAt` (settlement price, etc.). Nullable, backward-compatible add-on."
  expiration: FuturesExpiration

  entryPrice: BigInt! # qty-weighted average entry price
  closePrice: BigInt! # qty-weighted average exit price
  "Signed running net qty. Mirrors UserDeliverySessionPointer.netQuantity while OPEN; 0 once CLOSE."
  netQuantity: Int!
  maxQuantity: Int! # max absolute qty reached during the session
  closedQuantity: Int! # cumulative qty closed
  "Cumulative absolute quantity closed via liquidation in this session (default 0). 'Was liquidated' = liquidatedQuantity > 0."
  liquidatedQuantity: Int! # default 0
  realizedPnl: BigInt!
  tradingFees: BigInt!

  openedAt: BigInt!
  lastTradeAt: BigInt!

  fills: [Fill!]! @derivedFrom(field: "positionSession")
  trades: [Trade!]! @derivedFrom(field: "positionSession")
}

enum PositionSessionStatus {
  OPEN
  CLOSE
}

# Per-tx sentinel used by handleOrderLiquidated / handlePositionLiquidated to bump
# `Futures.totalLiquidations` exactly once regardless of how many legs the
# keeper liquidation tx contained. The entity itself carries no data — its
# existence is the dedup signal.
type LiquidationTx @entity(immutable: true) {
  id: Bytes! # transaction hash
}

# Bad debt event when a participant or the insurance fund cannot cover a loss.
type BadDebtEvent @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  user: User!
  amount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Order book price level aggregation per (expirationAt, price, side).
type PriceLevel @entity(immutable: false) {
  "ID format: {expirationAt}-{price}-{bid|ask}"
  id: String!
  expirationAt: BigInt!
  "Expiration metadata for `expirationAt` (settlement price, etc.). Nullable, backward-compatible add-on."
  expiration: FuturesExpiration
  price: BigInt!
  isBid: Boolean!
  totalQuantity: Int! # sum of ACTIVE OrderEntry remaining contracts at this level
}

# Internal indexer lookup: tracks the open PositionSession + running net qty / entry price
# for a (user, expirationAt) pair. Not derived because GraphQL has no Map<expirationAt, …> support.
type UserDeliverySessionPointer @entity(immutable: false) {
  id: Bytes! # user address ++ expirationAt encoded
  user: User!
  expirationAt: BigInt!
  netQuantity: Int! # signed running net qty
  aggregatedEntryPrice: BigInt!
  "ID of the currently-OPEN PositionSession for this (user, expirationAt). Empty string when flat."
  currentSessionId: String!
  "ID of the most recently CLOSED PositionSession for this (user, expirationAt). Empty string until the first close. Lets same-tx PositionLiquidated re-derive the closing Trade id after the pointer has gone flat."
  lastClosedSessionId: String!
}
