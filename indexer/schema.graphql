# Root entity for contract-wide state and stats
type Futures @entity(immutable: false) {
  "Singleton entity, use id=0"
  id: Int8!

  # Contract addresses
  contractAddress: Bytes!
  "Vault holding user collateral; the ERC-20 itself is read off the vault."
  collateralVault: Bytes!
  "Oracle the contract prices against; matches the `priceOracle()` getter."
  priceOracle: Bytes!
  "Margin engine the contract defers to; matches the `portfolioMargin()` getter."
  portfolioMargin: Bytes!

  "Block number the indexer was configured to start from (sourced from the data source context, set via START_BLOCK_FUTURES)."
  startBlock: BigInt!

  # Configuration
  minimumPriceIncrement: BigInt!
  "Maker fee in basis points of notional; negative means a rebate."
  makerFeeBps: Int!
  "Taker fee in basis points of notional."
  takerFeeBps: Int!
  liquidationFeeBps: Int!
  liquidatorShareBps: Int!
  "Contract size in hashes/s\u00b7day (hashrate sustained over one day), read from the on-chain constant CONTRACT_SIZE_HPS_DAY. Oracle answers are rebased by CONTRACT_SIZE_HPS_DAY / (100 TH/s\u00b7day). Fixed at 1e15 (1 PH/s over a day), so one unit = 1 PH/s/day."
  contractSizeHpsDay: BigInt!
  expirationIntervalDays: Int!
  futureExpirationDatesCount: Int!
  firstFutureExpirationDate: BigInt!
  "Contracts are whole units, so quantities carry no decimals. Mirrors Perps.quantityDecimals (6 there, divisible positions) so both markets expose the same scaling knob."
  quantityDecimals: Int!

  # Pool balances
  collectedFeesBalance: BigInt!

  # Stats
  totalUsers: Int!
  "Orders ever created; one per on-chain orderId."
  totalOrders: Int!
  "Orders currently resting in the book (status ACTIVE or PARTIALLY_FILLED)."
  activeOrders: Int!
  "Trade rows ever created. One per (tx, user, position session), so a two-sided match bumps it by 2 and a flip by 3."
  totalTrades: Int!
  "Fill rows ever created. One per (OrderMatched, side); cash settlement and forced closes have no matched counterparty order and so no Fill."
  totalFills: Int!
  "Matched notional: sum of tradePrice * abs(quantity). No divisor since quantities are whole contracts; perps divides by 10^quantityDecimals."
  totalVolume: BigInt!
  "Liquidation transactions, not legs: one keeper tx closing several orders or positions counts once."
  totalLiquidations: Int!
  "Notional closed by force, in the same units as totalVolume: sum of exitPrice * abs(closedQuantity) over every PositionLiquidated."
  totalLiquidatedValue: BigInt!
  totalBadDebt: BigInt!

  # Timestamps
  initializedAt: BigInt!
  lastUpdatedAt: BigInt!
}

# First-class expiration entity holding cash-settlement metadata for one expiration date.
# Created lazily the first time any entity at that `expirationAt` is indexed; the settlement
# fields stay null until a `SettlementPriceRecorded` event pins the price.
type FuturesExpiration @entity(immutable: false) {
  "32-byte big-endian encoding of the expiration timestamp (expirationAt)."
  id: Bytes!
  "The expiration timestamp this entity represents."
  expirationAt: BigInt!

  "Pinned cash-settlement price (token decimals). Null until SettlementPriceRecorded fires; its presence is the 'settled' signal (no separate boolean)."
  settlementPrice: BigInt
  "Block timestamp at which the settlement price was pinned."
  settledAt: BigInt
  "Address that pinned the price (an explicit recordSettlementPrice caller or the first settlePosition for this expiry)."
  recordedBy: Bytes
  recordTransactionHash: Bytes
  recordBlockNumber: BigInt

  # Back-links (backward-compatible: existing entities keep their `expirationAt` scalar)
  orders: [Order!]! @derivedFrom(field: "expiration")
  positionSessions: [PositionSession!]! @derivedFrom(field: "expiration")
  trades: [Trade!]! @derivedFrom(field: "expiration")
  priceLevels: [PriceLevel!]! @derivedFrom(field: "expiration")
}

# User entity (replaces former Participant).
# Net position is per-expiration, so unlike perps' User it lives on
# UserDeliverySessionPointer rather than here — a user can be long one
# expiration and short another at the same time.
type User @entity(immutable: false) {
  id: Bytes! # user address
  address: Bytes!

  # Stats
  orderCount: Int!
  "Orders currently resting in the book (status ACTIVE or PARTIALLY_FILLED)."
  activeOrderCount: Int!
  "Trade rows: one per (tx, position session)."
  tradeCount: Int!
  "Fill rows: one per matched leg."
  fillCount: Int!
  realizedPnl: BigInt!

  "Transient: orderId of the user's most recent OrderCreated. Used by the indexer to attribute taker-side fills (OrderMatched only carries makerOrderId). Not intended for client queries."
  lastCreatedOrderId: Bytes!

  # Relations
  orders: [Order!]! @derivedFrom(field: "user")
  trades: [Trade!]! @derivedFrom(field: "user")
  fills: [Fill!]! @derivedFrom(field: "user")
  positionSessions: [PositionSession!]! @derivedFrom(field: "user")
  "Per-(user, expirationAt) running net qty + open-session pointers, one entry per expiration date the user has touched."
  deliveryPointers: [UserDeliverySessionPointer!]! @derivedFrom(field: "user")
  badDebts: [BadDebtEvent!]! @derivedFrom(field: "user")

  # Timestamps
  createdAt: BigInt!
  lastActivityAt: BigInt!
}

# One per on-chain orderId, so `id` is what cancelOrder / liquidateOrders take.
type Order @entity(immutable: false) {
  id: Bytes! # on-chain orderId
  user: User!
  price: BigInt!
  expirationAt: BigInt!
  "Expiration metadata for `expirationAt` (settlement price, etc.). Nullable, backward-compatible add-on."
  expiration: FuturesExpiration
  isBuy: Boolean! # true = long/buy, false = short/sell
  # Counts (contracts)
  "Remaining open contracts resting in the book; zero once terminal."
  quantity: BigInt!
  "Contracts requested by the OrderCreated event that opened this order."
  originalQuantity: BigInt!
  "Contracts that became fills."
  filledQuantity: BigInt!
  "Contracts that left the book without matching (amend shrink, cancel, self-cross, IOC remainder, expiry, liquidation)."
  cancelledQuantity: BigInt!
  "Quantity-weighted average price across all fills against this order. Zero if no fills."
  averageFillPrice: BigInt!
  status: OrderStatus!
  "EOA that sent the tx where this order closed (tx.from). NOT necessarily the participant — for liquidations it's the keeper, for expiry it's whoever called removeOutdatedOrders. Use `liquidator` for semantic close attribution."
  closedByTx: Bytes
  "Keeper that force-cancelled this order; populated only when status = LIQUIDATED (from the paired OrderLiquidated event)."
  liquidator: Bytes
  "Fee paid by the order's participant to `liquidator`; populated only when status = LIQUIDATED."
  liquidationFee: BigInt

  # Relations
  fills: [Fill!]! @derivedFrom(field: "order")

  # Metadata
  createdAt: BigInt!
  updatedAt: BigInt!
  closedAt: BigInt
  blockNumber: BigInt!
  transactionHash: Bytes!
}

enum OrderStatus {
  "Resting with no fills yet."
  ACTIVE
  "Resting with at least one fill; still has remaining quantity."
  PARTIALLY_FILLED
  "Terminal: left the book fully matched."
  FILLED
  "Terminal: left the book with zero fills — user cancel, amend-to-zero, or an IOC/FOK order whose size was fully absorbed by self-crossing. A partially filled IOC ends FILLED instead, with its unmatched remainder in `cancelledQuantity`."
  CANCELLED
  "Terminal: force-cancelled by a keeper via liquidateOrder / liquidateOrders."
  LIQUIDATED
  "Terminal, futures-only: swept by removeOutdatedOrders after `expirationAt` passed."
  EXPIRED
}

# Aggregate of all fills (across counterparties) in a single tx for one user and
# PositionSession. Mirrors perps' Trade entity.
type Trade @entity(immutable: false) {
  id: Bytes! # tx hash + user + positionSession id
  user: User!
  positionSession: PositionSession!
  expirationAt: BigInt!
  "Expiration metadata for `expirationAt` (settlement price, etc.). Nullable, backward-compatible add-on."
  expiration: FuturesExpiration

  tradePrice: BigInt! # quantity-weighted average fill price
  tradeQuantity: BigInt! # signed sum of fill quantities
  tradingFee: BigInt!
  realizedPnl: BigInt!
  "User.realizedPnl after this trade was applied, including this trade. Opens snapshot the prior total (usually 0). 30-day realized PnL is current User.realizedPnl minus the latest Trade.cumulativeRealizedPnl with timestamp before the window."
  cumulativeRealizedPnl: BigInt!
  netQuantityAfter: BigInt! # position after the last fill
  aggregatedEntryPriceAfter: BigInt! # entry price after the last fill
  fillCount: Int!

  "True when this Trade was a forced liquidation against the market."
  isLiquidation: Boolean! # default false
  "Keeper that triggered the liquidation; set only when isLiquidation."
  liquidator: Bytes # nullable
  "Fee paid to the liquidator; set only when isLiquidation."
  liquidationFee: BigInt # nullable

  fills: [Fill!]! @derivedFrom(field: "trade")

  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# One per user per OrderMatched leg. Individual execution against a counterparty.
# Cash-settlement and liquidation exits have no matched counterparty order, so
# they produce a Trade but no Fill.
type Fill @entity(immutable: true) {
  id: Bytes! # tx hash + log index + leg suffix
  trade: Trade!
  "Whether `user` was the maker (resting order) or the taker (incoming order) in this match."
  side: FillSide!
  user: User!
  counterparty: User!
  "The user's own order in this match (taker order when `side` is TAKER, maker order when `side` is MAKER)."
  order: Order!
  "The counterparty's order in this match. The resting/maker order when `side` is TAKER; the incoming/taker order when `side` is MAKER."
  counterpartyOrder: Order!
  positionSession: PositionSession!
  expirationAt: BigInt!

  fillPrice: BigInt!
  fillQuantity: BigInt! # signed: positive = bought/long, negative = sold/short
  netQuantityAfter: BigInt! # user's (expirationAt) net qty after this fill
  aggregatedEntryPriceAfter: BigInt!
  realizedPnl: BigInt! # non-zero when this fill closed (full or partial) size
  tradingFee: BigInt! # signed: positive = paid, negative = rebate
  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

enum FillSide {
  MAKER
  TAKER
}

# Open→close cycle for a (user, expirationAt) pair.
# A user can have multiple sessions concurrently — one per expiration date.
type PositionSession @entity(immutable: false) {
  id: String! # blockNumber (12 digits) + logIndex (6 digits) + side (2 digits); deterministic
  status: PositionSessionStatus!
  user: User!
  expirationAt: BigInt!
  "Expiration metadata for `expirationAt` (settlement price, etc.). Nullable, backward-compatible add-on."
  expiration: FuturesExpiration

  entryPrice: BigInt! # quantity-weighted average entry price
  closePrice: BigInt! # quantity-weighted average exit price (updated as we close)
  "Signed running net qty. Mirrors UserDeliverySessionPointer.netQuantity while OPEN; 0 once CLOSE."
  netQuantity: BigInt!
  maxQuantity: BigInt! # max absolute qty reached during the session
  closedQuantity: BigInt! # cumulative qty closed
  "Cumulative absolute quantity closed via liquidation in this session (default 0). 'Was liquidated' = liquidatedQuantity > 0."
  liquidatedQuantity: BigInt! # default 0
  realizedPnl: BigInt!
  tradingFees: BigInt! # signed: positive = paid, negative = rebate received

  openedAt: BigInt!
  lastTradeAt: BigInt!

  fills: [Fill!]! @derivedFrom(field: "positionSession")
  trades: [Trade!]! @derivedFrom(field: "positionSession")
}

enum PositionSessionStatus {
  OPEN
  CLOSE
}

# Per-tx sentinel used by handleOrderLiquidated / handlePositionLiquidated to bump
# `Futures.totalLiquidations` exactly once regardless of how many legs the
# keeper liquidation tx contained. The entity itself carries no data — its
# existence is the dedup signal.
type LiquidationTx @entity(immutable: true) {
  id: Bytes! # transaction hash
}

# Bad debt event when a participant or the insurance fund cannot cover a loss.
type BadDebtEvent @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  user: User!
  amount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Order book price level aggregation per (expirationAt, price, side).
type PriceLevel @entity(immutable: false) {
  "ID format: {expirationAt}-{price}-{bid|ask}"
  id: String!
  expirationAt: BigInt!
  "Expiration metadata for `expirationAt` (settlement price, etc.). Nullable, backward-compatible add-on."
  expiration: FuturesExpiration
  price: BigInt!
  isBid: Boolean!
  totalQuantity: BigInt! # sum of remaining contracts across resting orders at this level
  orderCount: Int! # resting orders at this level
}

# Internal indexer lookup: tracks the open PositionSession + running net qty / entry price
# for a (user, expirationAt) pair. Not derived because GraphQL has no Map<expirationAt, …> support.
type UserDeliverySessionPointer @entity(immutable: false) {
  id: Bytes! # user address ++ expirationAt encoded
  user: User!
  expirationAt: BigInt!
  netQuantity: BigInt! # signed running net qty
  aggregatedEntryPrice: BigInt!
  "ID of the currently-OPEN PositionSession for this (user, expirationAt). Empty string when flat."
  currentSessionId: String!
  "ID of the most recently CLOSED PositionSession for this (user, expirationAt). Empty string until the first close. Lets same-tx PositionLiquidated re-derive the closing Trade id after the pointer has gone flat."
  lastClosedSessionId: String!
}
