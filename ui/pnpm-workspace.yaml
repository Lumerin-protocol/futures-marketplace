# ox 0.14.29 (pinned by viem 2.54.0) ships a type error in tempo/KeyAuthorization.ts
# that breaks `tsc --noEmit`, since it is a .ts source file and therefore not
# covered by skipLibCheck. 0.14.33 fixes it. Scoped to viem 2.54.0 so that older
# viem copies in the tree keep their own ox major. See ui/TECH_DEBT.md.
overrides:
  viem@2.54.0>ox: 0.14.33

# `@reown/appkit` is unused in src; wagmi 2 still pulls it via
# `@walletconnect/ethereum-provider`. Keep the build script allowed so
# `pnpm install` does not fail with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  '@reown/appkit': true
  '@swc/core': true
  bufferutil: true
  esbuild: true
  keccak: true
  secp256k1: true
  sharp: true
  utf-8-validate: true

minimumReleaseAgeExclude:
  - konekt-ui@0.3.0
  - konekt@0.2.0 || 0.2.1
