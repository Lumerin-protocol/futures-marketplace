name: Test Contracts

on:
  pull_request:
    branches:
      - dev
      - stg
      - main
    paths:
      - "contracts/**"
      - ".github/workflows/test-contracts.yml"
  push:
    branches:
      - dev
      - stg
      - main
    paths:
      - "contracts/**"
      - ".github/workflows/test-contracts.yml"

concurrency:
  group: test-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: contracts/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test
