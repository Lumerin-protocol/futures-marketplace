name: Test Contracts

on:
  pull_request:
    branches:
      - dev
      - stg
      - main
    paths:
      - "contracts/**"
      - ".github/workflows/test-contracts.yml"
  push:
    branches:
      - dev
      - stg
      - main
    paths:
      - "contracts/**"
      - ".github/workflows/test-contracts.yml"

concurrency:
  group: test-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: contracts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile contracts
        run: pnpm compile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
