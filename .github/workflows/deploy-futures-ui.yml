name: Deploy Futures UI

# Public build-time values (chain id, addresses, subgraph URLs, …) come from
# config/dev.env and config/prd.env. GitHub Environments `dev` → config/dev.env;
# `main` → config/prd.env. Secrets and computed values (WalletConnect,
# read-only RPC, marketplace URL, version) are written to ui/.env and win.

on:
  push:
    branches:
      - dev
      - main
      - 'cicd/**'

    paths:
      - '.github/workflows/deploy-futures-ui.yml'
      - 'config/*.env'
      - 'ui/src/**'
      - 'ui/public/**'
      - 'ui/package.json'
      - 'ui/pnpm-lock.yaml'
      - 'ui/vite.config.ts'
      - 'ui/tsconfig.json'
      - 'ui/index.html'
      - 'ui/.cicd_trigger'

  pull_request:
    branches:
      - dev
      - main
    paths:
      - '.github/workflows/deploy-futures-ui.yml'
      - 'config/*.env'
      - 'ui/src/**'
      - 'ui/public/**'
      - 'ui/package.json'
      - 'ui/pnpm-lock.yaml'
      - 'ui/vite.config.ts'
      - 'ui/tsconfig.json'
      - 'ui/index.html'
      - 'ui/.cicd_trigger'

  # On-demand: run from any branch and choose "dev" to ship that ref to DEV.
  # main stays locked to its own branch by GitHub Environment policy.
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment. Feature branches can only deploy to dev."
        required: true
        type: choice
        options:
          - dev
          - main

concurrency:
  group: ci-futures-ui-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for creating releases and tags

env:
  SERVICE_NAME: futures-marketplace

jobs:
  config-scope:
    name: Config scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip the other environment's config
        id: gate
        run: |
          # dev does not deploy when the only change is config/prd.env.
          # main does not deploy when the only change is config/dev.env.
          # Any other file still deploys. A manual run always deploys.
          REF="${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "$REF"
            FILES=$(git diff --name-only "origin/${REF}...HEAD")
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            FILES=$(git diff --name-only "${{ github.event.before }}" HEAD)
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SKIP="config/prd.env"
          [ "$REF" = "main" ] && SKIP="config/dev.env"
          RUN=true
          if [ -n "$FILES" ] && [ -z "$(printf '%s\n' "$FILES" | grep -vx "$SKIP" || true)" ]; then
            RUN=false
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "ref=$REF skip=$SKIP run=$RUN"
          printf '%s\n' "$FILES"

  generate-tag:
    needs: config-scope
    if: needs.config-scope.result == 'success' && needs.config-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    name: 📦 Generate Tag
    outputs:
      tag_name: ${{ steps.gen_tag.outputs.tag_name }}
      vtag: ${{ steps.gen_tag.outputs.vtag }}
      vfull: ${{ steps.gen_tag.outputs.vfull }}
      version: ${{ steps.gen_tag.outputs.version }}
      environment: ${{ steps.gen_tag.outputs.environment }}
      should_create_release: ${{ steps.gen_tag.outputs.should_create_release }}
      is_cicd_branch: ${{ steps.gen_tag.outputs.is_cicd_branch }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate version tag
        id: gen_tag
        uses: ./.github/actions/gen-tag
        with:
          component: ui
          major_version: "3"
          environment_override: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || '' }}

  setup:
    name: ⚙️ Setup
    needs:
      - generate-tag
    if: github.event_name != 'pull_request' && needs.generate-tag.outputs.is_cicd_branch != 'true'
    runs-on: ubuntu-latest
    # NO environment scope - uses repo-level AWS_ROLE_ARN secrets
    outputs:
      environment: ${{ needs.generate-tag.outputs.environment }}
      s3_bucket: ${{ steps.get_deployment_config.outputs.s3_bucket }}
      cloudfront_distribution: ${{ steps.get_deployment_config.outputs.cloudfront_distribution_id }}
      aws_region: ${{ steps.get_deployment_config.outputs.aws_region }}
      marketplace_url: ${{ steps.get_deployment_config.outputs.marketplace_url }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.generate-tag.outputs.environment == 'dev' && secrets.AWS_ROLE_ARN_DEV || secrets.AWS_ROLE_ARN_LMN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-Marketplace-Setup-${{ github.run_id }}

      - name: Get deployment configuration from AWS Secrets Manager
        id: get_deployment_config
        run: |
          ENV="${{ needs.generate-tag.outputs.environment }}"

          # Map environment to AWS secret suffix
          case $ENV in
            dev)
              SECRET_NAME="futures-marketplace-secrets-v3-dev"
              ;;
            main)
              SECRET_NAME="futures-marketplace-secrets-v3-lmn"
              ;;
          esac

          echo "📦 Retrieving deployment config from AWS Secrets Manager: ${SECRET_NAME}"

          # Retrieve the secret
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id ${SECRET_NAME} \
            --query SecretString \
            --output text)

          # Parse deployment configuration
          S3_BUCKET=$(echo $SECRET_JSON | jq -r '.deployment.s3_bucket')
          CF_DISTRO=$(echo $SECRET_JSON | jq -r '.deployment.cloudfront_distribution_id')
          MARKETPLACE_URL=$(echo $SECRET_JSON | jq -r '.deployment.marketplace_url')
          AWS_REGION=$(echo $SECRET_JSON | jq -r '.deployment.aws_region')

          # Output for use in subsequent jobs
          echo "s3_bucket=${S3_BUCKET}" >> $GITHUB_OUTPUT
          echo "cloudfront_distribution_id=${CF_DISTRO}" >> $GITHUB_OUTPUT
          echo "marketplace_url=${MARKETPLACE_URL}" >> $GITHUB_OUTPUT
          echo "aws_region=${AWS_REGION}" >> $GITHUB_OUTPUT

          echo "✅ Deployment Configuration:"
          echo "   S3 Bucket: ${S3_BUCKET}"
          echo "   CloudFront: ${CF_DISTRO}"
          echo "   URL: ${MARKETPLACE_URL}"
          echo "   Region: ${AWS_REGION}"

  build:
    name: 🔨 Build
    needs:
      - generate-tag
      - setup
    if: github.event_name != 'pull_request' && needs.generate-tag.outputs.is_cicd_branch != 'true'
    runs-on: ubuntu-latest
    # HAS environment scope - can access environment-scoped secrets/variables
    environment:
      name: ${{ needs.generate-tag.outputs.environment }}
      url: ${{ needs.setup.outputs.marketplace_url }}
    outputs:
      version: ${{ needs.generate-tag.outputs.vtag }}
      environment: ${{ needs.setup.outputs.environment }}
      s3_bucket: ${{ needs.setup.outputs.s3_bucket }}
      cloudfront_distribution: ${{ needs.setup.outputs.cloudfront_distribution }}
      aws_region: ${{ needs.setup.outputs.aws_region }}
      marketplace_url: ${{ needs.setup.outputs.marketplace_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Write secrets and computed values
        id: create_env
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          ENV="${{ needs.generate-tag.outputs.environment }}"
          VERSION="${{ needs.generate-tag.outputs.vtag }}"

          case "$ENV" in
            dev) CONFIG_ENV=dev ;;
            main) CONFIG_ENV=prd ;;
            *)
              echo "::error::Unknown environment '$ENV' (expected dev or main)"
              exit 1
              ;;
          esac

          echo "config_env=${CONFIG_ENV}" >> "$GITHUB_OUTPUT"
          echo "🔧 Public config from config/${CONFIG_ENV}.env"
          echo "📌 Version tag: ${VERSION}"

          # ui/.env holds only secrets and values computed by this run.
          # Public keys come from config/<env>.env via `pnpm build:dev` / `build:prd`.
          : > ui/.env

          put() {
            local name="$1" src="$2" mode="${3:-show}" value
            case "$src" in
              secrets) value=$(jq -r --arg k "$name" '.[$k] // empty' <<< "$SECRETS_JSON") ;;
              *)       value="$src" ;;
            esac
            [ -n "$value" ] || return 0
            printf '%s=%s\n' "$name" "$value" >> ui/.env
            case "$mode" in
              hide) ;;
              mask) echo "$name=$(printf '%s' "$value" | cut -c1-4)****" ;;
              *)    echo "$name=$value" ;;
            esac
          }

          echo "📄 Overlay .env (sanitized):"
          echo "------------------------------"
          put REACT_APP_READ_ONLY_ETH_NODE_URL secrets mask
          put REACT_APP_WALLET_CONNECT_ID secrets mask
          put REACT_APP_URL "${{ needs.setup.outputs.marketplace_url }}"
          put REACT_APP_VERSION "$VERSION"
          put DEV_SERVER_HTTPS "false"
          echo "------------------------------"

      - name: Install dependencies
        working-directory: ui
        run: |
          echo "📦 Installing dependencies..."
          pnpm install --frozen-lockfile

      - name: Build application
        working-directory: ui
        env:
          CONFIG_ENV: ${{ steps.create_env.outputs.config_env }}
        run: |
          echo "🏗️ Building application from config/${CONFIG_ENV}.env..."
          case "$CONFIG_ENV" in
            dev) pnpm build:dev ;;
            prd) pnpm build:prd ;;
            *)
              echo "::error::Unknown config env '$CONFIG_ENV'"
              exit 1
              ;;
          esac

          echo "✅ Build complete"
          ls -lh build/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ needs.generate-tag.outputs.environment }}
          path: ui/build/
          retention-days: 1

  build-pr:
    name: 🔨 Build (PR)
    needs:
      - generate-tag
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # NO environment scope - PR builds run without GitHub Environment binding
    # to avoid environment protection rules blocking the build.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Write dummy secrets
        run: |
          VERSION="${{ needs.generate-tag.outputs.vtag }}"
          echo "🔧 PR build — config/dev.env plus dummy secrets (no deploy)"
          echo "📌 Version tag: ${VERSION}"
          cat > ui/.env << EOF
          REACT_APP_READ_ONLY_ETH_NODE_URL=https://example.com
          REACT_APP_WALLET_CONNECT_ID=0000000000000000000000000000000000000000
          REACT_APP_VERSION=${VERSION}
          DEV_SERVER_HTTPS=false
          EOF
          echo "✅ Dummy overlay .env created"

      - name: Install dependencies
        working-directory: ui
        run: |
          echo "📦 Installing dependencies..."
          pnpm install --frozen-lockfile

      - name: Build application
        working-directory: ui
        run: |
          echo "🏗️ Building application from config/dev.env..."
          pnpm build:dev

          echo "✅ Build complete"
          ls -lh build/

      - name: PR build summary
        run: |
          echo "## 🔨 PR Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** Build only (no deployment)" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.generate-tag.outputs.vtag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build:** ui/build/ produced successfully from config/dev.env plus dummy secrets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build verification successful — deploy will run on merge" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [generate-tag, setup, build]
    if: github.event_name != 'pull_request' && needs.generate-tag.outputs.is_cicd_branch != 'true'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.generate-tag.outputs.environment }}
          path: build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.generate-tag.outputs.environment == 'dev' && secrets.AWS_ROLE_ARN_DEV || secrets.AWS_ROLE_ARN_LMN }}
          aws-region: ${{ needs.setup.outputs.aws_region }}
          role-session-name: GitHubActions-Marketplace-Deploy-${{ github.run_id }}

      - name: Deploy to S3
        run: |
          echo "🚀 Deploying to S3 bucket: ${{ needs.setup.outputs.s3_bucket }}"
          aws s3 sync build/ s3://${{ needs.setup.outputs.s3_bucket }}/ --delete

          echo "✅ Files uploaded to S3"

      - name: Invalidate CloudFront cache
        run: |
          echo "🔄 Invalidating CloudFront distribution: ${{ needs.setup.outputs.cloudfront_distribution }}"
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.setup.outputs.cloudfront_distribution }} \
            --paths "/*"

          echo "✅ CloudFront cache invalidated"

  verify:
    name: 🔍 Verify
    runs-on: ubuntu-latest
    needs: [generate-tag, setup, build, deploy]
    if: github.event_name != 'pull_request' && needs.generate-tag.outputs.is_cicd_branch != 'true'

    steps:
      - name: Wait for CloudFront propagation
        run: |
          echo "⏳ Waiting for CloudFront to propagate changes..."
          echo "   CloudFront invalidations typically take 1-5 minutes"
          echo "   Waiting 90 seconds for initial propagation..."
          sleep 90
          echo "✅ Wait complete, proceeding to verification"

      - name: Verify deployment and version
        run: |
          URL="${{ needs.setup.outputs.marketplace_url }}"
          EXPECTED_VERSION="${{ needs.generate-tag.outputs.vtag }}"

          echo "🧪 Verifying deployment at $URL"
          echo "📌 Expected version: $EXPECTED_VERSION"

          # Fetch the page
          HTTP_CODE=$(curl -o /tmp/page.html -s -w "%{http_code}" "$URL")

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Marketplace returned HTTP $HTTP_CODE"
            echo "::error::Marketplace not accessible (HTTP $HTTP_CODE)"
            exit 1
          fi

          echo "✅ Marketplace is accessible (HTTP $HTTP_CODE)"

          # Extract version from meta tag
          ACTUAL_VERSION=$(grep -oP '<meta name="application-version" content="\K[^"]+' /tmp/page.html || echo "")

          if [ -z "$ACTUAL_VERSION" ]; then
            echo "⚠️ WARNING: Could not extract version from page"
            echo "::warning::Version meta tag not found on deployed page"
            echo "📄 HTML head section:"
            grep -A 10 "<head>" /tmp/page.html || echo "Could not extract head section"
          elif [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ]; then
            echo "✅ Version matches! Deployed: $ACTUAL_VERSION"
            echo "::notice::Deployment verified successfully with version $ACTUAL_VERSION"
          else
            echo "⚠️ WARNING: Version mismatch!"
            echo "   Expected: $EXPECTED_VERSION"
            echo "   Actual:   $ACTUAL_VERSION"
            echo "::warning::Deployed version ($ACTUAL_VERSION) does not match expected version ($EXPECTED_VERSION)"
          fi

  summary:
    name: 📊 Summary & Tag
    runs-on: ubuntu-latest
    needs: [generate-tag, setup, build, deploy, verify]
    if: always() && needs.generate-tag.result != 'skipped' && github.event_name != 'pull_request' && needs.generate-tag.outputs.is_cicd_branch != 'true'

    steps:
      - name: Clone repository
        if: needs.verify.result == 'success'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        if: needs.verify.result == 'success'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        if: needs.verify.result == 'success'
        run: |
          TAG_NAME=${{ needs.generate-tag.outputs.tag_name }}
          echo "🏷️ Creating tag after successful deployment: $TAG_NAME"

          # Check if tag already exists
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "⚠️ Tag $TAG_NAME already exists, skipping tag creation"
          else
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME - Deployed to ${{ needs.generate-tag.outputs.environment }}"
            git push origin "$TAG_NAME"
            echo "✅ Tag $TAG_NAME created and pushed"
          fi

      - name: Create GitHub Release
        if: needs.verify.result == 'success' && needs.generate-tag.outputs.should_create_release == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.generate-tag.outputs.tag_name }}
          release_name: Marketplace ${{ needs.generate-tag.outputs.tag_name }}
          body: |
            ## Marketplace Release ${{ needs.generate-tag.outputs.tag_name }}

            **Environment:** Production
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Deployed:** ${{ needs.setup.outputs.marketplace_url }}

            ### Changes
            This production release includes the latest changes from the main branch.
          draft: false
          prerelease: false

      - name: Deployment summary
        if: needs.verify.result == 'success'
        run: |
          echo "## 🎉 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** Marketplace" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.generate-tag.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.generate-tag.outputs.vtag }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ needs.setup.outputs.marketplace_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**S3 Bucket:** ${{ needs.setup.outputs.s3_bucket }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Marketplace deployed and verified successfully" >> $GITHUB_STEP_SUMMARY
          echo "🏷️ Git tag created: ${{ needs.generate-tag.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.generate-tag.outputs.should_create_release }}" == "true" ]; then
            echo "📦 GitHub Release created for production deployment" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Failure summary
        if: needs.verify.result != 'success'
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** Marketplace" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.generate-tag.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.generate-tag.outputs.vtag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Deployment or verification failed. Check logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "🚫 Tag NOT created - deployment was not successful" >> $GITHUB_STEP_SUMMARY

  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [generate-tag, setup, build, deploy, verify, summary]
    if: always() && needs.generate-tag.result != 'skipped' && github.event_name != 'pull_request'

    steps:
      - name: Checkout (for composite action)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.generate-tag.outputs.is_cicd_branch }}" == "true" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          elif [ "${{ needs.verify.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          elif [ "${{ needs.verify.result }}" == "failure" ] || [ "${{ needs.deploy.result }}" == "failure" ] || [ "${{ needs.build.result }}" == "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          elif [ "${{ needs.verify.result }}" == "cancelled" ] || [ "${{ needs.deploy.result }}" == "cancelled" ]; then
            echo "status=cancelled" >> $GITHUB_OUTPUT
          else
            echo "status=skipped" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        uses: ./.github/actions/slack-notify
        with:
          status: ${{ steps.status.outputs.status }}
          environment: ${{ needs.generate-tag.outputs.environment }}
          service_name: "Futures UI"
          version: ${{ needs.generate-tag.outputs.vtag }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_info: "${{ needs.generate-tag.outputs.is_cicd_branch == 'true' && '*Mode:* CI/CD Test (no build/deploy)' || format('*URL:* {0}', needs.setup.outputs.marketplace_url) }}"
