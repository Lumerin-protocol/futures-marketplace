name: Test Market Maker

on:
  pull_request:
    branches:
      - dev
      - stg
      - main
    paths:
      - "market-maker/**"
      - ".github/workflows/test-market-maker.yml"
  push:
    branches:
      - dev
      - stg
      - main
    paths:
      - "market-maker/**"
      - ".github/workflows/test-market-maker.yml"

concurrency:
  group: test-market-maker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Market Maker Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./market-maker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: market-maker/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test
