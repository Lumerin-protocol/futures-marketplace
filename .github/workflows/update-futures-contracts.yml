name: Update Futures Contracts

on:
  # push:
  #   branches:
  #     - dev
  #     - stg
  #     - main

  #   paths:
  #     - '.github/workflows/update-futures-contracts.yml'
  #     - 'contracts/contracts/HashPowerFutures.sol'
  #     - 'contracts/scripts/update-futures.ts'

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev=DEV, main=LMN/PROD)"
        required: true
        type: choice
        options:
          - dev
          - main

concurrency:
  group: ci-futures-contracts-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  update-futures:
    name: Update futures contracts
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment
      || github.ref_name }}
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.environment ||
            github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: contracts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Map config environment
        id: cfg
        run: |
          ENV="${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}"
          case "$ENV" in
            dev) echo "config_env=dev" >> "$GITHUB_OUTPUT" ;;
            main) echo "config_env=prd" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Unknown environment '$ENV' (expected dev or main)"
              exit 1
              ;;
          esac

      - name: Run update script
        run: pnpm hardhat --env ${{ steps.cfg.outputs.config_env }} run scripts/update-futures.ts
        env:
          ETH_NODE_ADDRESS: ${{ secrets.ETH_NODE_ADDRESS }}
          OWNER_PRIVATEKEY: ${{ secrets.OWNER_PRIVATEKEY }}
          PROPOSER_PRIVATEKEY: ${{ secrets.PROPOSER_PRIVATEKEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
