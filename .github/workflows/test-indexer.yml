name: Test Indexer

on:
  pull_request:
    branches:
      - dev
      - stg
      - main
    paths:
      - "indexer/**"
      - "contracts/abi/**"
      - ".github/workflows/test-indexer.yml"
  push:
    branches:
      - dev
      - stg
      - main
    paths:
      - "indexer/**"
      - "contracts/abi/**"
      - ".github/workflows/test-indexer.yml"

concurrency:
  group: test-indexer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Indexer Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./indexer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: indexer/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render subgraph manifest
        env:
          NETWORK: arbitrum-sepolia
          FUTURES_ADDRESS: "0x0000000000000000000000000000000000000000"
          START_BLOCK_FUTURES: "0"
        run: pnpm prepare:env

      - name: Generate types
        run: pnpm codegen

      - name: Run tests
        run: pnpm test
