name: Test Indexer

on:
  pull_request:
    branches:
      - dev
      - stg
      - main
    paths:
      - "indexer/**"
      - "contracts/**"
      - ".github/workflows/test-indexer.yml"
  push:
    branches:
      - dev
      - stg
      - main
    paths:
      - "indexer/**"
      - "contracts/**"
      - ".github/workflows/test-indexer.yml"

concurrency:
  group: test-indexer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Indexer Tests
    # matchstick ships no binary for Ubuntu 26, which ubuntu-latest became in 2026-10.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          # Hash both lockfiles — integration tests pull in `futures-contracts`
          # (which has its own pnpm-lock.yaml) for the deployment fixture.
          cache-dependency-path: |
            indexer/pnpm-lock.yaml
            contracts/pnpm-lock.yaml

      - name: Install indexer dependencies
        working-directory: ./indexer
        run: pnpm install --frozen-lockfile

      - name: Install contracts dependencies
        working-directory: ./contracts
        run: pnpm install --frozen-lockfile

      # Integration tests deploy the real Futures stack via
      # `deployFuturesFixture` from `futures-contracts/test-api`, which reads
      # JSON artifacts from `contracts/artifacts/`. Compile both contracts
      # workspaces (futures + transitive collateral-margin) so the fixture can
      # load their bytecode.
      - name: Compile contracts
        working-directory: ./contracts
        run: pnpm compile

      - name: Render subgraph manifest
        working-directory: ./indexer
        run: |
          ENV_FILE=.env.example pnpm prepare:env
          echo "--- subgraph.yaml ---"
          cat subgraph.yaml

      - name: Generate types
        working-directory: ./indexer
        run: pnpm codegen

      - name: Lint
        working-directory: ./indexer
        run: pnpm lint

      - name: Typecheck
        working-directory: ./indexer
        run: pnpm typecheck

      # matchstick-ts runs `graph test` without -v, which otherwise asks the GitHub API for the
      # latest Matchstick release and fails when it is rate-limited; graph-cli trusts a cache
      # younger than a day.
      - name: Pin Matchstick
        working-directory: ./indexer
        run: echo "{\"version\":\"0.6.0\",\"timestamp\":$(date +%s000)}" > tests/.latest.json

      - name: Run unit tests
        working-directory: ./indexer
        run: pnpm test:unit

      - name: Run integration tests
        working-directory: ./indexer
        run: pnpm test:integration
